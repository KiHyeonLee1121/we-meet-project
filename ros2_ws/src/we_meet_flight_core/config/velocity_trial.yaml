# Shared v1/v2 command-based trial settings; camera starts only after acquisition.
advance_enabled: true
target_height_m: 3.0
commanded_target_distance_m: 5.0
commanded_distance_tolerance_m: 0.15
forward_speed_mps: 0.35
horizontal_accel_mps2: 0.25
zero_velocity_hold_s: 5.0
control_hz: 20.0
# Preserved yaw helper and existing distance-controller gains.
yaw_kp: 1.0
yaw_max_rate_rad_s: 0.35
vertical_kp: 0.6
vertical_kd: 0.15
vertical_speed_mps: 0.25
vertical_accel_mps2: 0.5
# The source distance_filter only smooths raw slant range; it does NOT tilt-correct.
lidar_input_is_vertical_height: false
# Placeholder: measure body reference -> sensor downward offset before live trial.
lidar_body_down_offset_m: 0.0
maximum_tilt_rad: 0.35
lidar_rate_window_s: 0.5
