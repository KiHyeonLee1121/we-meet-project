# Shared v1/v2 command-based trial settings; camera starts only after acquisition.
advance_enabled: true
target_height_m: 3.0
commanded_target_distance_m: 5.0
commanded_distance_tolerance_m: 0.15
forward_speed_mps: 0.35
horizontal_accel_mps2: 0.25
zero_velocity_hold_s: 5.0
control_hz: 20.0
# Preserved yaw helper and existing distance-controller gains.
yaw_kp: 1.0
yaw_max_rate_rad_s: 0.35
vertical_kp: 0.6
vertical_kd: 0.15
vertical_speed_mps: 0.25
vertical_accel_mps2: 0.5
# The source distance_filter only smooths raw slant range; it does NOT tilt-correct.
lidar_input_is_vertical_height: false
# Placeholder: measure body reference -> sensor downward offset before live trial.
lidar_body_down_offset_m: 0.0
maximum_tilt_rad: 0.35
lidar_rate_window_s: 0.5

vision_enabled: false

# 2026-10-02 failure guards: provisional limits, NOT measured aircraft specs.
# FC ODOMETRY(331) at 20 Hz over the existing MAVROS MAVLink-v2 link is required.
fc_odometry_timeout_s: 0.3
maximum_position_sigma_m: 0.5
maximum_velocity_sigma_mps: 0.2
gps_accuracy_required: true
gps_timeout_s: 2.0
maximum_gps_sigma_m: 0.5
horizontal_tracking_limit_m: 1.0
horizontal_tracking_dwell_s: 0.5
position_velocity_residual_limit_m: 0.5
position_velocity_window_s: 1.0
yaw_abort_error_rad: 0.261799388   # 15 degrees
yaw_abort_rate_rad_s: 0.610865238 # 35 degrees/s
yaw_abort_dwell_s: 0.5
# Only valid over the same fixed, flat reflecting surface; verify on Pi.
lidar_velocity_check_enabled: true
lidar_velocity_disagreement_mps: 0.25
lidar_velocity_disagreement_s: 0.75
hold_horizontal_speed_mps: 0.15
hold_vertical_speed_mps: 0.10
