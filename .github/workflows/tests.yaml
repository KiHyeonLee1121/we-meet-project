name: v1-offline-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/offline_demo.py --output /tmp/v1.jsonl
      - run: python tools/offline_demo.py --ascent-only
      - run: python tools/offline_demo.py --irregular
      - run: python tools/replay_commands.py /tmp/v1.jsonl
