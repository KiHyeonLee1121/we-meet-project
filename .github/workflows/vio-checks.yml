name: VIO checks
on:
  push:
    branches: [test-flying-vio]
  pull_request:
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'numpy>=1.24,<3' 'opencv-python-headless>=4.6,<5' 'PyYAML>=6,<7'
      - run: python3 tools/check.py
      - run: python3 tools/offline_simulation.py
  jazzy:
    runs-on: ubuntu-latest
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: Install actual ROS and OpenVINS dependencies
        run: |
          apt-get update
          apt-get install -y git build-essential libeigen3-dev libboost-all-dev libceres-dev libopencv-dev python3-colcon-common-extensions python3-opencv python3-numpy python3-yaml python3-serial ros-jazzy-cv-bridge ros-jazzy-image-transport ros-jazzy-mavros ros-jazzy-mavros-extras ros-jazzy-tf2-ros-py
      - name: Fetch pinned real estimator and build ROS packages
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          python3 tools/fetch_openvins.py
          cd ros2_ws
          MAKEFLAGS=-j2 colcon build --packages-up-to ov_msckf we_meet_vio --executor sequential --cmake-args -DCMAKE_BUILD_TYPE=Release -DENABLE_ARUCO_TAGS=OFF -DDISABLE_MATPLOTLIB=ON
      - name: Check actual ROS adapters without hardware
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source ros2_ws/install/setup.bash
          python3 tools/check.py
          python3 tools/smoke_ros.py
