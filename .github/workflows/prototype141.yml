name: Prototype 141 offline checks
on:
  push:
    branches: [test-flying-prototype]
  pull_request:
    branches: [test-flying-prototype]
jobs:
  archive-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_141.py
      - run: python -m compileall -q ros2_ws/src tools laptop_ai/laptop_ai
